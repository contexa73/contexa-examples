server:
  port: ${SCENARIO_PORT:19082}

contexa:
  infrastructure:
    mode: standalone
  saas:
    enabled: false
  iam:
    seed:
      enabled: false
  datasource:
    url: jdbc:h2:mem:contexa_agent_hostile_jpa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  bridge:
    enabled: true

security:
  zerotrust:
    enabled: true
    mode: SHADOW

spring:
  datasource:
    url: jdbc:h2:mem:legacy_customer_hostile_jpa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: customer_schema_that_must_not_leak
        globally_quoted_identifiers: true
