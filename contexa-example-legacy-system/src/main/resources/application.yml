# This example keeps the legacy login: @EnableAISecurity(mode = SecurityMode.SANDBOX) means the application owns
# sign-in (HOST_OWNED). LegacySecurityConfig declares the application's chain and puts the legacy session user into
# the SecurityContext, which @Protectable needs.
server:
  port: 9090

spring:
  application:
    name: contexa-example-legacy-system
  datasource:
    # The legacy application's own database (in-memory here).
    url: jdbc:h2:mem:legacy_customer;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  thymeleaf:
    cache: false

contexa:
  infrastructure:
    mode: standalone
  saas:
    enabled: false
  datasource:
    # The dedicated Contexa database (PostgreSQL with the vector extension). Required.
    url: ${CONTEXA_DB_URL:jdbc:postgresql://localhost:5432/contexa}
    username: ${CONTEXA_DB_USERNAME:contexa}
    password: ${CONTEXA_DB_PASSWORD:contexa}
  jpa:
    hibernate:
      ddl-auto: update
  bridge:
    enabled: true
  security:
    zerotrust:
      enabled: true
      mode: SHADOW
    tiered:
      layer2:
        # The whole Layer 2 analysis. A local 8B model on one GPU takes 10-40 s a call and Layer 2 may make two
        # calls, so the default 30 s would leave decisions held for review (docs: Decision Tuning).
        timeout-ms: 120000
    evidence:
      signing:
        # A local example key. For anything beyond a local run set CONTEXA_EVIDENCE_KEY (Base64, 32 bytes or more).
        keys:
          example: ${CONTEXA_EVIDENCE_KEY:Sa/yfEAwSZwei5hpVC4TImjU/jJqS0lsLdSNZxxErqA=}
        active-key-id: example
  llm:
    selection:
      chat:
        priority: ollama
      embedding:
        priority: ollama
    chat:
      ollama:
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        model: qwen3:8b
        keep-alive: 30m
    embedding:
      ollama:
        model: mxbai-embed-large

logging:
  level:
    io.contexa: INFO
    io.contexa.contexaexamplelegacysystem: DEBUG
