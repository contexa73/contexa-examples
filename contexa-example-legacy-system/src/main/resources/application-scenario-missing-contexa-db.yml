server:
  port: ${SCENARIO_PORT:19086}

contexa:
  infrastructure:
    mode: standalone
  saas:
    enabled: false
  iam:
    seed:
      enabled: false
  bridge:
    enabled: true

security:
  zerotrust:
    enabled: true
    mode: SHADOW

spring:
  datasource:
    url: jdbc:h2:mem:legacy_customer_missing_contexa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
