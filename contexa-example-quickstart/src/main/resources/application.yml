server:
  port: 8081
contexa:
  infrastructure:
    mode: DISTRIBUTED
  vectorstore:
    pgvector:
      indexType: HNSW
      distanceType: COSINE_DISTANCE
      dimensions: 1024
      initialize-schema: true
  llm:
    selection:
      chat:
        mode: dynamic-priority
        priority: openai,anthropic
      embedding:
        mode: dynamic-priority
        priority: openai
  datasource:
    url: ${CONTEXA_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/contexa}}
    username: ${CONTEXA_DB_USERNAME:${DB_USERNAME:contexa}}
    password: ${CONTEXA_DB_PASSWORD:${DB_PASSWORD:contexa1234!@#}}
    driver-class-name: ${CONTEXA_DB_DRIVER:org.postgresql.Driver}
    isolation:
      contexa-owned-application: true
  security:
    zerotrust:
      mode: SHADOW
  hcad:
    geoip:
      enabled: true
      dbPath: data/GeoLite2-City.mmdb
spring:
  application:
    name: contexa-example-quickstart
  datasource:
    url: jdbc:postgresql://localhost:5432/contexa
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:1111}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
  ai:
    chat:
      model:
        priority: ollama
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        options:
          model: qwen2.5:7b
          keep-alive: 24h
      embedding:
        enabled: true
        model: mxbai-embed-large
