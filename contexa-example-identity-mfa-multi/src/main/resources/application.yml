server:
  port: 8088

spring:
  application:
    name: contexa-example-identity-mfa-multi

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database: H2
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update

contexa:
  infrastructure:
    mode: standalone
  datasource:
    url: ${CONTEXA_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/contexa}}
    username: ${CONTEXA_DB_USERNAME:${DB_USERNAME:contexa}}
    password: ${CONTEXA_DB_PASSWORD:${DB_PASSWORD:contexa1234!@#}}
    driver-class-name: ${CONTEXA_DB_DRIVER:org.postgresql.Driver}
    isolation:
      contexa-owned-application: true
  llm:
    selection:
      chat:
        mode: dynamic-priority
        priority: ollama
    chat:
      ollama:
        baseUrl: http://127.0.0.1:11434
        model: qwen2.5:7b
        keepAlive: 24h
    embedding:
      ollama:
        dedicatedRuntimeEnabled: false
        model: mxbai-embed-large
        dimensions: 1024
  vectorstore:
    pgvector:
      indexType: HNSW
      distanceType: COSINE_DISTANCE
      dimensions: 1024
      initialize-schema: true
