plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
}

bootJar.enabled = false
jar.enabled = false

allprojects {
    group = 'io.contexa'
    version = '0.0.1-SNAPSHOT'

    repositories {
        // Contexa 0.1.0 comes from Maven Local (run `./gradlew publishToMavenLocal` in the contexa repository)
        // or from Maven Central once it is published there.
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        // The Contexa starter brings no model provider and no PgVector starter: add them (installation guide, step 1).
        implementation 'ai.ctxa:spring-boot-starter-contexa:0.1.0'
        implementation platform('org.springframework.ai:spring-ai-bom:1.1.8')
        implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
        implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

        runtimeOnly 'org.postgresql:postgresql'
        runtimeOnly 'com.h2database:h2'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
