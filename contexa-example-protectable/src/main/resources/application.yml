server:
  port: 8082

contexa:
  llm:
    enabled: false
  capability:
    mode: warn
  infrastructure:
    mode: standalone
  datasource:
    url: ${CONTEXA_DB_URL:jdbc:postgresql://localhost:5432/contexa_oss}
    username: ${CONTEXA_DB_USERNAME:${DB_USERNAME:contexa}}
    password: ${CONTEXA_DB_PASSWORD:${DB_PASSWORD:contexa1234!@#}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

spring:
  application:
    name: contexa-example-protectable

  datasource:
    url: jdbc:postgresql://localhost:5432/contexa
    username: ${DB_USERNAME:contexa}
    password: ${DB_PASSWORD:contexa1234!@#}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: POSTGRESQL
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update

  sql:
    init:
      mode: always

  ai:
    chat:
      model:
        priority: ollama

    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        options:
          model: qwen2.5:7b
          keep-alive: "24h"
      embedding:
        enabled: true
        model: mxbai-embed-large

    vectorstore:
      pgvector:
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
